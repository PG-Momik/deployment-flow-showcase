<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deployment flow showcase</title>
    <style>
      body { font: 18px system-ui, sans-serif; max-width: 42rem; margin: 10vh auto; padding: 0 1rem; line-height: 1.5; }
      code { background: #eee; padding: .15rem .3rem; }
    </style>
  </head>
  <body>
    <h1>From commit to production</h1>
    <p>Follow one change from <code>main</code> through staging to a production version tag.</p>
    <ol>
      <li><strong>Dev:</strong> a squash merge into <code>main</code> starts a build and dev deploy.</li>
    </ol>
    <p>Commit: <code id="commit">loading</code></p>
    <script>
      fetch('./manifest.json').then(response => response.json()).then(manifest => {
        document.querySelector('#commit').textContent = manifest.sha;
      });
    </script>
  </body>
</html>
