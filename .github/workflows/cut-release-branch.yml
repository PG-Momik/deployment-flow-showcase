name: Cut release branch
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: cut-release-branch
jobs:
  cut:
    runs-on: ubuntu-latest
    environment: cut-release-branch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create and deploy release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(node scripts/release.mjs next)
          git push origin "HEAD:refs/heads/$branch"
          gh workflow run deploy.yml --ref "$branch"
          echo "Staging branch: $branch" >> "$GITHUB_STEP_SUMMARY"
