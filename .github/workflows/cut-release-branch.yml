name: Cut release branch
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: cut-release-branch
jobs:
  cut:
    runs-on: ubuntu-latest
    environment: cut-release-branch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create and deploy release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(node scripts/release.mjs next)
          existing_sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if [[ -z "$existing_sha" ]]; then
            git push origin "HEAD:refs/heads/$branch"
          else
            echo "Reusing $branch at $existing_sha" >> "$GITHUB_STEP_SUMMARY"
          fi
          gh workflow run deploy.yml --ref "$branch"
          echo "Staging branch: $branch" >> "$GITHUB_STEP_SUMMARY"
